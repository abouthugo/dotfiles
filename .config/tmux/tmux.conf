# CTRL-SPACE for prefix keybind
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Stop tmux from starting a login shell
# ref: https://bbs.archlinux.org/viewtopic.php?id=305053
# ref: https://wiki.archlinux.org/title/Tmux#Start_a_non-login_shell
set -g default-command "${SHELL}"

# Optional stuff
set -g mouse on

# Custom mappings
bind -n M-h previous-window
bind -n M-l next-window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -n M-f display-popup -E ~/bin/tmux-sessionizer

# Theme
set -g @plugin "abouthugo/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme "github"
set -g @tokyo-night-tmux_window_id_style roman
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_date_format MDY

set -g @tokyo-night-tmux_show_netspeed 0

# Straight from TPM
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
